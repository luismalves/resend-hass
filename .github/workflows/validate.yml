name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        env:
          # The default token is what lets the action read a private repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          category: integration
          # ponytail: brand assets only matter for the public HACS default
          # store, which a private repo can never join. Drop the ignore if
          # this repo goes public and gets submitted.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tests/test_payload.py
