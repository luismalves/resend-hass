name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          # ponytail: only blocks submission to the HACS default store, not
          # installing this as a custom repository. Two ways to clear it:
          # drop icon.png + logo.png into custom_components/resend/brand/, or
          # add "resend" to github.com/home-assistant/brands. Both need a real
          # logo, so this stays ignored until you pick one.
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tests/test_payload.py
